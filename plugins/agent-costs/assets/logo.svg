<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>agent-costs: the receipt that audits your agents</title>
  <style>
    .ink { stroke: #111; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: #111; }
    .paper { fill: #fbf8f1; stroke: #111; }
    .shadow { fill: #111; opacity: .12; }
    .red { stroke: #d6362b; fill: none; }
    .redfill { fill: #d6362b; }
    .shine { fill: #fbf8f1; }
    @media (prefers-color-scheme: dark) {
      .paper { stroke: #fbf8f1; }
      .shadow { fill: #000; opacity: .45; }
    }
  </style>

  <g transform="rotate(-5 256 256)">
    <!-- shadow -->
    <path class="shadow" d="M150 66 h228 a14 14 0 0 1 14 14 v372 l-20 -16 -20 16 -20 -16 -20 16 -20 -16 -20 16 -20 -16 -20 16 -20 -16 -20 16 -20 -16 -20 16 v-372 a14 14 0 0 1 14 -14 z"/>

    <!-- receipt -->
    <path class="paper" stroke-width="10" stroke-linejoin="round"
          d="M138 52 h228 a14 14 0 0 1 14 14 v372 l-20 -16 -20 16 -20 -16 -20 16 -20 -16 -20 16 -20 -16 -20 16 -20 -16 -20 16 -20 -16 -20 16 v-372 a14 14 0 0 1 14 -14 z"/>

    <!-- face: a skeptical brow, a monocle, a knowing smirk -->
    <path class="ink" stroke-width="9" d="M180 104 q22 -16 46 -6"/>
    <path class="ink" stroke-width="9" d="M280 102 q22 -4 42 6"/>
    <circle class="dot" cx="204" cy="134" r="12"/>
    <circle class="dot" cx="302" cy="134" r="12"/>
    <circle class="shine" cx="306" cy="130" r="4"/>
    <circle class="shine" cx="208" cy="130" r="4"/>
    <circle class="ink" stroke-width="8" cx="302" cy="134" r="30"/>
    <path class="ink chain" stroke-width="5" d="M330 146 q26 30 8 70 q-10 24 18 44"/>
    <path class="ink" stroke-width="9" d="M222 180 q30 18 64 -6"/>
    <path class="ink" stroke-width="7" d="M284 168 l6 10"/>

    <!-- line items -->
    <path class="ink" stroke-width="5" stroke-dasharray="2 14" d="M166 222 h184"/>
    <path class="ink" stroke-width="12" d="M170 256 h86 M306 256 h40"/>
    <path class="ink" stroke-width="12" opacity=".55" d="M170 290 h62 M318 290 h28"/>
    <path class="ink" stroke-width="12" opacity=".55" d="M170 324 h74 M324 324 h22"/>
    <path class="ink" stroke-width="5" d="M166 356 h184 M166 368 h184"/>
    <path class="ink" stroke-width="16" d="M170 400 h50 M290 400 h56"/>
  </g>

  <!-- the stamp -->
  <g transform="rotate(-16 372 382)">
    <circle class="shine" cx="372" cy="382" r="78"/>
    <circle class="red" stroke-width="7" cx="372" cy="382" r="74"/>
    <circle class="red" stroke-width="3" cx="372" cy="382" r="48"/>
    <path id="top" fill="none" d="M311 382 a61 61 0 0 1 122 0"/>
    <path id="bottom" fill="none" d="M305 382 a67 67 0 0 0 134 0"/>
    <g font-family="Helvetica Neue, Arial, sans-serif" font-weight="800" class="redfill">
      <text font-size="17" letter-spacing="4"><textPath href="#top" startOffset="50%" text-anchor="middle">AUDITED</textPath></text>
      <text font-size="14" letter-spacing="3"><textPath href="#bottom" startOffset="50%" text-anchor="middle">&#177;0.03%</textPath></text>
    </g>
    <path class="red" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" d="M352 384 l14 14 l28 -32"/>
  </g>
</svg>
